name: Build CompEditor

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            package: appimage
            artifact: linux-x86_64
            files: dist/*.AppImage
          - runner: macos-15
            package: dmg
            artifact: macos-arm64
            files: target/release/*.dmg
          - runner: macos-15-intel
            package: dmg
            artifact: macos-x86_64
            files: target/release/*.dmg
          - runner: windows-2025
            package: nsis
            artifact: windows-x86_64
            files: target/release/*setup.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
        shell: bash
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev desktop-file-utils xvfb
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: scripts/package-appimage.sh
      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          timeout 15s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/CompEditor-0.1.0-x86_64.AppImage examples/compose.yaml || status=$?
          test "$status" -eq 124
      - name: Install desktop packager
        if: runner.os != 'Linux'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build native package
        if: runner.os != 'Linux'
        run: cargo packager --release --formats ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: CompEditor-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  dev-release:
    needs: packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: compeditor-dev-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CompEditor-*
          path: packages
      - name: Collect release packages
        shell: bash
        run: |
          shopt -s nullglob
          mkdir release
          copy_package() {
            local destination=$1
            shift
            if [[ $# -ne 1 || ! -s ${1:-} ]]; then
              echo "Expected exactly one nonempty package for $destination" >&2
              return 1
            fi
            cp -- "$1" "release/$destination"
          }
          copy_package CompEditor-dev-linux-x86_64.AppImage packages/CompEditor-linux-x86_64/*.AppImage
          copy_package CompEditor-dev-macos-arm64.dmg packages/CompEditor-macos-arm64/*.dmg
          copy_package CompEditor-dev-macos-x86_64.dmg packages/CompEditor-macos-x86_64/*.dmg
          copy_package CompEditor-dev-windows-x86_64-setup.exe packages/CompEditor-windows-x86_64/*setup.exe
      - name: Publish development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="dev-${GITHUB_SHA}"
          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" == false ]]; then
              echo "Development prerelease $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "CompEditor Dev (${GITHUB_SHA:0:12})" \
              --notes "Development build from commit $GITHUB_SHA."
          fi

          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
